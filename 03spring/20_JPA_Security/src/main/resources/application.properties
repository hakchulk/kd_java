spring.application.name=20_JPA_Security

# mysql set
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# allowPublicKeyRetrieval=true: 서버로부터 공개키를 가져오는 것을 허용
spring.datasource.url=jdbc:mysql://localhost:3306/security?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234

# Hibernate 설정을 명시적으로 설정
spring.jpa.properties.hibernate.show_sql=true
# SQL 로그를 예쁘게 출력
spring.jpa.properties.hibernate.format_sql=true
# 간단하게 SQL 로그 출력
spring.jpa.show-sql=true

# ── [커넥션 풀 설정 - HikariCP] ───────
# 최소 커넥션 수
spring.datasource.hikari.minimum-idle=5
# 최대 커넥션 수
spring.datasource.hikari.maximum-pool-size=10
# 자동 커밋 설정
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=HikariCP
# 커넥션 유지 시간 (ms)
spring.datasource.hikari.idle-timeout=600000
# 커넥션 대기 시간 (ms)
spring.datasource.hikari.connection-timeout=30000
# 커넥션 최대 수명 (ms)
spring.datasource.hikari.max-lifetime=1800000


# none, create, create-drop, update, validate
spring.jpa.properties.hibernate.hbm2ddl.auto=update